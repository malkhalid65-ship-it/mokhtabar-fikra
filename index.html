<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مختبر فكرة مشروعك | المستشار محمد الخالد</title><style>
:root{--g:#173f35;--gold:#f2b705;--bg:#f4f7f6}*{box-sizing:border-box}body{font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--g);margin:0}.wrap{max-width:820px;margin:auto;padding:18px}.hero{background:var(--g);color:#fff;padding:30px 22px;border-radius:20px;text-align:center}.card{background:#fff;margin:15px 0;padding:20px;border-radius:16px;box-shadow:0 3px 14px #0001}.q{font-weight:700;margin-bottom:12px}.opt{display:block;border:1px solid #d6e2dd;padding:11px;margin:7px 0;border-radius:10px}.opt:hover{background:#edf5f1}input,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccd8d3;border-radius:9px}input[type=radio]{width:auto;margin-left:7px}button{background:var(--gold);color:var(--g);border:0;padding:14px 24px;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer}.secondary{background:#e7efeb}.result,.booking{display:none;text-align:center}.score{font-size:42px;font-weight:900}.note,.status{font-size:13px;color:#66736e}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.docno{margin:4px 0 10px;font-weight:700;color:#0d5a3e;font-size:14px}</style></head><body><div class="wrap">
<div class="hero"><svg viewBox="0 0 120 120" width="112" height="112" aria-label="شعار مختبر فكرة مشروعك" role="img">
<circle cx="60" cy="60" r="51" fill="white" stroke="#0d5a3e" stroke-width="7"/>
<path d="M31 86 C48 77,58 62,68 43" fill="none" stroke="#0d5a3e" stroke-width="8" stroke-linecap="round"/>
<path d="M64 42 L83 31 L80 54 Z" fill="#0d5a3e"/>
<path d="M46 72 C30 73,23 65,22 54 C36 54,47 58,46 72Z" fill="#0d5a3e"/>
<path d="M49 67 C49 50,58 42,68 39 C69 53,63 65,49 67Z" fill="#0d5a3e"/>
</svg><h1>مختبر فكرة مشروعك</h1><h3>المستشار محمد الخالد</h3><p class="docno">وثيقة العمل رقم FL-654884630</p><p style="margin:8px 0 0">اختبر فكرتك قبل أن تستثمر فيها</p><p>10 أسئلة مجانية • النتيجة تظهر فورًا</p></div>
<div class="card"><h2>بياناتك</h2><label>الاسم</label><input id="name"><label>رقم الجوال</label><input id="phone" type="tel"><label>البريد الإلكتروني (اختياري)</label><input id="email" type="email"></div>
<form id="quiz"></form><div style="text-align:center"><button onclick="submitQuiz(event)">إظهار نتيجتي</button></div>
<div class="card result" id="result"><div>نتيجتك</div><div class="score" id="score"></div><h2 id="label"></h2><p id="desc"></p><p class="note">هذه النتيجة تقيس جاهزيتك ولا تمثل ضمانًا لنجاح المشروع أو ربحيته.</p><div class="actions"><button onclick="openBooking('individual')">جلسة فردية - 100 SAR</button><button class="secondary" onclick="openBooking('group')">جلسة جماعية - 70 SAR</button></div><div class="status" id="mailStatus"></div></div>
<div class="card booking" id="booking"><h2>حجز الموعد</h2><h3 id="bookingTitle"></h3><label>اختر الموعد المتاح</label><select id="slot"><option value="">اختر التاريخ والوقت</option></select><label>ملاحظات (اختياري)</label><input id="notes"><button onclick="sendBooking(event)">إرسال طلب الحجز</button><div class="status" id="bookingStatus"></div><p class="note">تظهر هنا فقط المواعيد التي أتاحها المستشار.</p></div></div>
<script>
const ENDPOINT='https://formsubmit.co/ajax/malkhalid65@gmail.com';
const qs=[["١","هل لديك فكرة مشروع؟",[["محددة جدًا",3],["لدي أكثر من فكرة",2],["غير واضحة",1],["لا توجد",0]]],["٢","هل تعرف لماذا تريد المشروع؟",[["فرصة سوق واضحة",3],["دخل إضافي",2],["الاستقلال",2],["تقليد الآخرين",0]]],["٣","هل حددت المبلغ الذي تستطيع المخاطرة به؟",[["نعم بدقة",3],["تقريبًا",2],["غير واضح",1],["لا",0]]],["٤","هل حددت وقتك المتاح أسبوعيًا؟",[["نعم",3],["تقريبًا",2],["قليل",1],["لا أعرف",0]]],["٥","هل تعرف عميلك المستهدف؟",[["جيدًا",3],["لدي تصور أولي",2],["غير متأكد",1],["لا",0]]],["٦","هل درست المنافسين؟",[["نعم",3],["بعضهم",2],["معرفة بسيطة",1],["لا",0]]],["٧","هل تعرف لماذا سيشتري منك العميل؟",[["سبب واضح",3],["لدي تصور",2],["غير متأكد",1],["لا أعرف",0]]],["٨","هل اختبرت الفكرة مع عملاء محتملين؟",[["نعم",3],["سألت بعض الأشخاص",2],["لا",0],["لا أعرف كيف",0]]],["٩","هل تستطيع تحمل خسارة مبلغ التجربة؟",[["نعم",3],["جزئيًا",2],["بصعوبة",1],["لا",0]]],["١٠","هل تعرف أول 3 خطوات للبدء؟",[["نعم",3],["بعضها",2],["غير واضحة",1],["لا",0]]]];
const f=document.getElementById('quiz');qs.forEach((q,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<div class=q>${q[0]}. ${q[1]}</div>`+q[2].map(o=>`<label class=opt><input type=radio name=q${i} value="${o[1]}" data-text="${o[0]}"> ${o[0]}</label>`).join('');f.appendChild(d)});
let last=null,bookingType='',schedule=null;
async function getSchedule(){try{let r=await fetch('/api/schedule',{cache:'no-store'});let j=await r.json();schedule=j.schedule}catch(e){schedule={timezone:"Asia/Riyadh",individual:{days:[0,3],times:["19:00","20:00","21:00"]},group:{days:[0,3],times:["19:00","20:30"]},custom_slots:[],disabled_dates:[]}}}
async function send(p){try{let r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(p)});return r.ok}catch(e){return false}}
async function submitQuiz(e){e.preventDefault();let name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),email=document.getElementById('email').value.trim();if(!name||!phone){alert('فضلاً أدخل الاسم ورقم الجوال');return}let total=0,lines=[];for(let i=0;i<10;i++){let x=document.querySelector(`input[name=q${i}]:checked`);if(!x){alert('فضلاً أجب عن جميع الأسئلة');return}total+=+x.value;lines.push(`${i+1}) ${qs[i][1]} — ${x.dataset.text} (${x.value})`)}let label,desc;if(total<=10){label='تحتاج إلى بناء الأساس';desc='قبل الاستثمار، ركّز على وضوح الفكرة والعميل وخطوات البداية.'}else if(total<=18){label='بداية جيدة مع فجوات';desc='لديك أساس، لكن توجد نقاط مهمة تحتاج تشخيصًا واختبارًا.'}else if(total<=24){label='جاهزية جيدة مبدئيًا';desc='الخطوة المناسبة هي اختبار الفكرة عمليًا قبل استثمار أكبر.'}else{label='جاهزية مرتفعة';desc='حان وقت فحص الفكرة وربطها بالسوق والمخاطر قبل التنفيذ.'}last={name,phone,email,total,label};score.textContent=total+'/30';document.getElementById('label').textContent=label;document.getElementById('desc').textContent=desc;result.style.display='block';result.scrollIntoView({behavior:'smooth'});let ok=await send({'_subject':`نتيجة جديدة | مختبر فكرة مشروعك | ${name} | ${total}/30`,'_template':'table','نوع الرسالة':'نتيجة الاختبار المجاني','الاسم':name,'الجوال':phone,'بريد العميل':email||'غير مذكور','النتيجة':`${total}/30`,'التصنيف':label,'الإجابات':lines.join('\n')});mailStatus.textContent=ok?'تم تسجيل نتيجتك بنجاح.':'ظهرت نتيجتك، وتعذر إرسال الإشعار مؤقتًا.'}
function fmtSlot(d,t){let [y,m,day]=d.split('-').map(Number),[h,min]=t.split(':').map(Number);let dt=new Date(y,m-1,day,h,min);let dayName=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][dt.getDay()];let dateText=new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{day:'numeric',month:'long',year:'numeric'}).format(dt);let timeText=new Intl.DateTimeFormat('ar-SA',{hour:'numeric',minute:'2-digit',hour12:true}).format(dt);return `${dayName} ${dateText} - ${timeText}`}
async function getOccupied(){try{let r=await fetch('/api/bookings',{cache:'no-store'});let j=await r.json();return j.occupied||[]}catch(e){return []}}
async function buildSlots(type){await getSchedule();let occupied=await getOccupied();let blocked=new Set(occupied.filter(x=>x.type===type).map(x=>`${x.date}|${x.time}`));let sel=document.getElementById('slot');sel.innerHTML='<option value="">اختر التاريخ والوقت</option>';let now=new Date(),map=new Map(),base=schedule[type]||{days:[],times:[]};for(let k=0;k<42;k++){let d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+k);let iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if((schedule.disabled_dates||[]).includes(iso))continue;if((base.days||[]).includes(d.getDay()))for(const t of (base.times||[])){let [h,m]=t.split(':').map(Number),dt=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m);if(dt>now&&!blocked.has(`${iso}|${t}`))map.set(`${iso}|${t}`,{date:iso,time:t,active:true})}}for(const s of (schedule.custom_slots||[])){if(!(s.type===type||s.type==='both'))continue;let key=`${s.date}|${s.time}`;if(s.active===false||blocked.has(key))map.delete(key);else if(!(schedule.disabled_dates||[]).includes(s.date))map.set(key,s)}[...map.values()].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(s=>{let o=document.createElement('option');o.value=`${s.date}|${s.time}`;o.textContent=fmtSlot(s.date,s.time);sel.appendChild(o)})}
async function openBooking(type){if(!last){alert('أكمل الاختبار أولًا');return}bookingType=type;bookingTitle.textContent=type==='individual'?'جلسة فردية - 100 SAR':'جلسة جماعية - 70 SAR';await buildSlots(type);booking.style.display='block';booking.scrollIntoView({behavior:'smooth'})}
async function sendBooking(e){
e.preventDefault();
let raw=slot.value;if(!raw){alert('فضلاً اختر الموعد');return}
let [date,time]=raw.split('|');
let service=bookingType==='individual'?'جلسة فردية - 100 SAR':'جلسة جماعية - 70 SAR';
bookingStatus.textContent='جارٍ تثبيت الموعد...';
try{
  let lock=await fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    type:bookingType,date,time,name:last.name,phone:last.phone,email:last.email,total:last.total,result:last.label,notes:notes.value.trim()
  })});
  let lj=await lock.json();
  if(lock.status===409){
    bookingStatus.textContent='عذرًا، تم حجز هذا الموعد قبل قليل. اختر موعدًا آخر.';
    await buildSlots(bookingType); return;
  }
  if(!lock.ok){
    bookingStatus.textContent='تعذر تثبيت الموعد الآن. حاول مرة أخرى.'; return;
  }
  let shown=fmtSlot(date,time);
  let ok=await send({'_subject':`حجز مؤكد | ${last.name} | ${service}`,'_template':'table','نوع الرسالة':'حجز مؤكد','الخدمة':service,'الاسم':last.name,'الجوال':last.phone,'بريد العميل':last.email||'غير مذكور','نتيجة الاختبار':`${last.total}/30 - ${last.label}`,'الموعد المؤكد':shown,'ملاحظات':notes.value.trim()||'لا يوجد'});
  bookingStatus.textContent='تم تأكيد حجزك بنجاح. الموعد أصبح محجوزًا لك.';
  slot.disabled=true;
}catch(err){bookingStatus.textContent='تعذر تثبيت الموعد الآن. حاول مرة أخرى.'}
}
</script></body></html>
